<style>
  :root {
    --primary: #0f4c5c;
    --primary-light: #e8f1f3;
    --accent: #e36414;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #d9e2e5;
    --bg: #f4f7f8;
    --white: #ffffff;
    --error: #c0392b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Cairo', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
  }

  [hidden] { display: none !important; }

  /* ===== الشريط العلوي ===== */
  .topbar {
    background: var(--primary);
    color: var(--white);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .logo {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--accent);
    display: grid; place-items: center;
    font-size: 20px;
  }
  .lang-btn {
    font-family: inherit;
    background: transparent;
    color: var(--white);
    border: 1px solid #ffffff80;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .lang-btn:hover { background: #ffffff1a; }

  /* ===== الكارت ===== */
  .card {
    max-width: 760px;
    margin: 28px auto;
    background: var(--white);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 4px 20px #0000000d;
  }
  h1 { margin: 0; color: var(--primary); font-size: 24px; }
  .subtitle { margin: 4px 0 20px; color: var(--muted); }

  /* ===== الأقسام ===== */
  fieldset {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px 6px;
    margin: 0 0 18px;
  }
  legend {
    padding: 0 8px;
    font-weight: 700;
    color: var(--primary);
  }

  /* ===== الحقول ===== */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }

  input, select {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--white);
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  input[type="file"] { padding: 8px; background: var(--bg); }

  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }

  /* ===== زرار الإرسال ===== */
  .submit-btn {
    width: 100%;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--white);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
  }
  .submit-btn:hover { filter: brightness(1.05); }

  /* ===== الموبايل ===== */
  @media (max-width: 600px) {
    .card { margin: 0; border-radius: 0; padding: 20px 16px; }
    .row { grid-template-columns: 1fr; }
  }
</style>
